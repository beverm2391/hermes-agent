# Live public canary targets for web extraction. These are not unit fixtures:
# the workflow intentionally hits real websites through the configured provider.
defaults:
  timeout_s: 90
  min_chars: 200
  require_success: true
  forbidden_contains:
    - "access denied"
    - "are you a robot"
    - "checking your browser"
    - "enable javascript and cookies"
    - "just a moment"

cases:
  - id: basic_html_example
    tier: basic_html
    url: https://example.com/
    min_chars: 50
    expected_contains:
      - "Example Domain"

  - id: basic_html_python
    tier: basic_html
    url: https://www.python.org/about/
    min_chars: 500
    expected_contains:
      - "Python"
      - "About"

  - id: js_required_quotes
    tier: javascript_required
    url: https://quotes.toscrape.com/js/
    min_chars: 500
    expected_contains:
      - "The world as we have created it"

  - id: soft_wall_atlantic
    tier: soft_paywall_or_overlay
    url: https://www.theatlantic.com/
    min_chars: 500
    expected_contains:
      - "The Atlantic"

  - id: hard_wall_wsj
    tier: hard_paywall
    url: https://www.wsj.com/
    min_chars: 500
    expected_contains:
      - "The Wall Street Journal"

  - id: bot_protection_nowsecure
    tier: bot_protection
    url: https://nowsecure.nl/
    min_chars: 20
    expected_contains:
      - "OH YEAH"
